name: goforge CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.24.5"

            - name: Set up golangci-lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.11
                  install-only: true

            - name: Tidy dependencies
              run: go mod tidy

            - name: Verify dependencies
              run: go mod verify

            - name: Run tests -> vet -> lint -> build
              run: make check

            - name: Version check
              run: ./bin/goforge version

            - name: Clean up binaries
              run: make clean
