name: goforge CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.24.5"

            - name: Verify deps, run tests, vet, lint, and build
              run: make check

            - name: Version Check
              run: ./bin/goforge version

            - name: Clean up
              run: make clean
